<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Redirect</title>
    <meta http-equiv="refresh" content="0; url=/#/auth">
    <script>
    "use strict";

    // Providers redirect to a path without URL fragments (#). Our app uses hash routing.
    // Bridge /oauth/<provider>[/]?... -> /#/oauth/<provider>?...
    // Telegram may return callback payload in location.hash (e.g. #tgAuthResult=...).
    // Preserve it by converting hash payload into query params for the hash-router page.
    (() => {
      try {
        let path = window.location.pathname || "/";
        path = path.replace(/\/$/, "");

        const search = window.location.search || "";
        const hash = window.location.hash || "";

        // Prefer explicit query params, fallback to hash payload from Telegram.
        // Input:  #tgAuthResult=xxx  -> ?tgAuthResult=xxx
        const normalizedHashQuery =
          hash.startsWith("#") && hash.length > 1 ? `?${hash.slice(1)}` : "";

        const query = search || normalizedHashQuery;
        const target = `/#${path}${query}`;

        window.location.replace(target);
      } catch (_e) {
        window.location.replace("/#/auth");
      }
    })();
    </script>
  </head>
  <body>Redirecting…</body>
</html>
